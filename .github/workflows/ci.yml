name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.14.7"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          clean: false
          persist-credentials: false
          set-safe-directory: false
          show-progress: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14.7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check generated workflow
        run: just workflow-check

      - parallel:
          - name: Run tests
            run: just test

          - name: Check Python lint and syntax
            run: just lint
