name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.14.7"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          clean: false
          persist-credentials: false
          set-safe-directory: false
          show-progress: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Check lint and review workflow diagram
        if: runner.os == 'Linux'
        run: |
          just lint
          just workflow-check

      - name: Run tests
        env:
          # Exercise native CLI paths on Windows and the full CLI matrix on Linux and macOS.
          PYTEST_ADDOPTS: >-
            --durations=10
            ${{ runner.os == 'Windows' && '-m "not orchestrator_cli or windows_cli"' || '' }}
        run: just test
