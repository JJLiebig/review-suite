name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.14.7"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          clean: false
          fetch-depth: 2
          persist-credentials: false
          set-safe-directory: false
          show-progress: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Check lint and review workflow diagram
        if: runner.os == 'Linux'
        run: |
          just lint
          just workflow-check

      - name: Measure optimized CLI suite
        env:
          PYTEST_ADDOPTS: --durations=10
        run: uv run --locked pytest -q plugins/review-suite/tests/test_review_orchestrator_cli.py

      - name: Measure baseline CLI suite
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          RS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/review-suite-cli-before" "$RS_BASE_SHA"
          cd "$RUNNER_TEMP/review-suite-cli-before"
          uv run --locked pytest -q plugins/review-suite/tests/test_review_orchestrator_cli.py
