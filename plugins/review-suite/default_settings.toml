# Shipped defaults. User overrides: ~/.codex/state/review-suite/settings.toml
# All jobs use base except final deep signoff, which uses deep.

[base]
model = "gpt-6.1-terra"
reasoning = "high"

[deep]
model = "gpt-6.1-terra"
reasoning = "max"

# Optional per-job overrides inherit omitted fields from base/deep:
# [jobs.deslop]
# model = "gpt-5.6-luna"
# Jobs: plan, deslop, followup, base_signoff, deep_signoff. service_tier may also be set (fast/flex).

[jobs.plan]
model = "gpt-6-astra"
reasoning = "medium"
